<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Pro Player</title>
    <!-- External Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
    <!-- Custom Application Script -->
    <script src="app.js" defer></script>
</head>
<body>

<div class="app-container">
    <!-- Sidebar / Channel Navigation -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <span><i class="fa-solid fa-play-circle" style="color: var(--accent);"></i> IPTV Pro</span>
                <span id="channelCount" class="channel-count">0 Channels</span>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search channels...">
            </div>
            <select id="categorySelect" class="category-select">
                <option value="ALL">All Categories</option>
                <option value="FAV">★ Favorites</option>
            </select>
        </div>
        <div class="channel-list" id="channelList"></div>
    </div>

    <!-- Main Player Display Area -->
    <div class="main-content">
        <div class="video-wrapper" id="videoWrapper">
            <div class="loader" id="loader"></div>
            <video id="videoPlayer" playsinline autoplay></video>

            <!-- Video Overlay Controls -->
            <div class="controls-overlay">
                <div class="top-bar">
                    <button class="btn-toggle-sidebar" id="toggleSidebar">
                        <i class="fa-solid fa-bars"></i> Channels
                    </button>
                    <div class="current-channel-info">
                        <img id="currentLogo" class="current-channel-logo" src="" alt="" style="display:none;">
                        <span id="currentTitle" style="font-weight: 600;">Select a channel</span>
                    </div>
                </div>

                <div class="bottom-bar">
                    <div class="controls-left">
                        <button class="control-btn" id="playBtn"><i class="fa-solid fa-pause"></i></button>
                        <div class="volume-container">
                            <button class="control-btn" id="muteBtn"><i class="fa-solid fa-volume-high"></i></button>
                            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                        </div>
                    </div>
                    <div class="controls-right">
                        <select id="qualitySelect" class="quality-select">
                            <option value="-1">Auto Quality</option>
                        </select>
                        <button class="control-btn" id="pipBtn" title="Picture-in-Picture"><i class="fa-solid fa-clone"></i></button>
                        <button class="control-btn" id="fullscreenBtn"><i class="fa-solid fa-expand"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
