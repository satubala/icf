<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0e17;
            --bg-card: #131b2e;
            --bg-hover: #1e293b;
            --accent: #2563eb;
            --accent-hover: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --sidebar-width: 350px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Sidebar Channel List */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-card);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 20;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 16px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            background: var(--bg-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .category-select {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            position: relative;
        }

        .channel-item:hover {
            background: var(--bg-hover);
        }

        .channel-item.active {
            background: var(--accent);
        }

        .channel-logo {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: contain;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px;
            flex-shrink: 0;
        }

        .channel-details {
            flex: 1;
            overflow: hidden;
        }

        .channel-name {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-group {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .channel-item.active .channel-group {
            color: rgba(255, 255, 255, 0.8);
        }

        .fav-btn {
            color: var(--text-muted);
            font-size: 1rem;
            padding: 4px;
            transition: color 0.2s;
        }

        .fav-btn.active, .fav-btn:hover {
            color: #f59e0b;
        }

        /* Player Main Area */
        .main-content {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Player Controls Overlay */
        .controls-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.9) 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .video-wrapper.user-active .controls-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-channel-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .current-channel-logo {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .btn-toggle-sidebar {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            font-weight: 500;
        }

        .bottom-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .control-btn:hover {
            color: var(--accent-hover);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-slider {
            width: 70px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .quality-select {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 10px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                width: 85%;
                max-width: 320px;
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .volume-slider {
                display: none;
            }
        }

        /* Spinner Loader */
        .loader {
            position: absolute;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            display: none;
            z-index: 5;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <span><i class="fa-solid fa-play-circle" style="color: var(--accent);"></i> IPTV Pro</span>
                <span id="channelCount" style="font-size: 0.8rem; color: var(--text-muted); font-weight: normal;">0 Channels</span>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search channels...">
            </div>
            <select id="categorySelect" class="category-select">
                <option value="ALL">All Categories</option>
                <option value="FAV">★ Favorites</option>
            </select>
        </div>
        <div class="channel-list" id="channelList"></div>
    </div>

    <!-- Main Player Area -->
    <div class="main-content">
        <div class="video-wrapper" id="videoWrapper">
            <div class="loader" id="loader"></div>
            <video id="videoPlayer" playsinline autoplay></video>

            <!-- Video Overlay Controls -->
            <div class="controls-overlay">
                <div class="top-bar">
                    <button class="btn-toggle-sidebar" id="toggleSidebar">
                        <i class="fa-solid fa-bars"></i> Channels
                    </button>
                    <div class="current-channel-info">
                        <img id="currentLogo" class="current-channel-logo" src="" alt="" style="display:none;">
                        <span id="currentTitle" style="font-weight: 600;">Select a channel</span>
                    </div>
                </div>

                <div class="bottom-bar">
                    <div class="controls-left">
                        <button class="control-btn" id="playBtn"><i class="fa-solid fa-pause"></i></button>
                        <div class="volume-container">
                            <button class="control-btn" id="muteBtn"><i class="fa-solid fa-volume-high"></i></button>
                            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                        </div>
                    </div>
                    <div class="controls-right">
                        <select id="qualitySelect" class="quality-select">
                            <option value="-1">Auto Quality</option>
                        </select>
                        <button class="control-btn" id="pipBtn" title="Picture-in-Picture"><i class="fa-solid fa-clone"></i></button>
                        <button class="control-btn" id="fullscreenBtn"><i class="fa-solid fa-expand"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const PLAYLIST_URL = 'https://raw.githubusercontent.com/abusaeeidx/CricHd-playlists-Auto-Update-permanent/refs/heads/main/ALL.m3u';

    const video = document.getElementById('videoPlayer');
    const videoWrapper = document.getElementById('videoWrapper');
    const channelList = document.getElementById('channelList');
    const searchInput = document.getElementById('searchInput');
    const categorySelect = document.getElementById('categorySelect');
    const channelCount = document.getElementById('channelCount');
    const loader = document.getElementById('loader');
    const playBtn = document.getElementById('playBtn');
    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const pipBtn = document.getElementById('pipBtn');
    const qualitySelect = document.getElementById('qualitySelect');
    const toggleSidebarBtn = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');

    let hls = new Hls();
    let channelsData = [];
    let favorites = JSON.parse(localStorage.getItem('iptv_favs') || '[]');
    let currentChannelIndex = -1;
    let controlsTimeout;

    async function loadPlaylist() {
        showLoader(true);
        try {
            const response = await fetch(PLAYLIST_URL);
            const text = await response.text();
            channelsData = parseM3U(text);
            populateCategories();
            renderChannels(channelsData);

            // Auto resume last played channel
            const lastPlayedUrl = localStorage.getItem('iptv_last_channel');
            let initialIdx = channelsData.findIndex(ch => ch.url === lastPlayedUrl);
            if (initialIdx === -1 && channelsData.length > 0) initialIdx = 0;

            if (initialIdx !== -1) {
                playChannel(initialIdx);
            }
        } catch (err) {
            alert('Error loading channel playlist.');
            console.error(err);
        } finally {
            showLoader(false);
        }
    }

    function parseM3U(m3u) {
        const lines = m3u.split('\n');
        const channels = [];
        let current = {};

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (line.startsWith('#EXTINF:')) {
                const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                const groupMatch = line.match(/group-title="([^"]+)"/i);
                const commaIdx = line.lastIndexOf(',');
                const channelName = commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : 'Unknown Channel';

                current = {
                    id: 'ch_' + channels.length,
                    name: channelName,
                    logo: logoMatch ? logoMatch[1] : '',
                    group: groupMatch ? groupMatch[1] : 'General'
                };
            } else if (line.length > 0 && !line.startsWith('#')) {
                current.url = line;
                if (current.url) channels.push(current);
                current = {};
            }
        }
        return channels;
    }

    function populateCategories() {
        const groups = [...new Set(channelsData.map(ch => ch.group))].sort();
        categorySelect.innerHTML = '<option value="ALL">All Categories</option><option value="FAV">★ Favorites</option>';
        groups.forEach(group => {
            const opt = document.createElement('option');
            opt.value = group;
            opt.innerText = group;
            categorySelect.appendChild(opt);
        });
    }

    function renderChannels(channels) {
        channelList.innerHTML = '';
        channelCount.innerText = `${channels.length} Channels`;

        channels.forEach((ch) => {
            const realIdx = channelsData.findIndex(c => c.url === ch.url);
            const item = document.createElement('div');
            item.className = `channel-item ${realIdx === currentChannelIndex ? 'active' : ''}`;
            
            const isFav = favorites.includes(ch.url);
            const logoSrc = ch.logo || 'https://via.placeholder.com/40/131b2e/ffffff?text=TV';

            item.innerHTML = `
                <img class="channel-logo" src="${logoSrc}" onerror="this.src='https://via.placeholder.com/40/131b2e/ffffff?text=TV'" />
                <div class="channel-details">
                    <div class="channel-name">${ch.name}</div>
                    <div class="channel-group">${ch.group}</div>
                </div>
                <i class="fa-star ${isFav ? 'fa-solid fav-btn active' : 'fa-regular fav-btn'}"></i>
            `;

            // Favorite toggle
            const favIcon = item.querySelector('.fav-btn');
            favIcon.onclick = (e) => {
                e.stopPropagation();
                toggleFavorite(ch.url);
            };

            item.onclick = () => {
                playChannel(realIdx);
                if (window.innerWidth <= 768) sidebar.classList.remove('open');
            };

            channelList.appendChild(item);
        });
    }

    function toggleFavorite(url) {
        if (favorites.includes(url)) {
            favorites = favorites.filter(u => u !== url);
        } else {
            favorites.push(url);
        }
        localStorage.setItem('iptv_favs', JSON.stringify(favorites));
        filterChannels();
    }

    function filterChannels() {
        const query = searchInput.value.toLowerCase();
        const selectedGroup = categorySelect.value;

        const filtered = channelsData.filter(ch => {
            const matchesSearch = ch.name.toLowerCase().includes(query);
            let matchesCat = true;
            if (selectedGroup === 'FAV') {
                matchesCat = favorites.includes(ch.url);
            } else if (selectedGroup !== 'ALL') {
                matchesCat = ch.group === selectedGroup;
            }
            return matchesSearch && matchesCat;
        });

        renderChannels(filtered);
    }

    function playChannel(index) {
        if (index < 0 || index >= channelsData.length) return;
        
        currentChannelIndex = index;
        const channel = channelsData[index];
        localStorage.setItem('iptv_last_channel', channel.url);

        showLoader(true);
        document.getElementById('currentTitle').innerText = channel.name;
        const logoImg = document.getElementById('currentLogo');
        if (channel.logo) {
            logoImg.src = channel.logo;
            logoImg.style.display = 'block';
        } else {
            logoImg.style.display = 'none';
        }

        filterChannels(); // Update active UI highlight

        if (Hls.isSupported()) {
            hls.destroy();
            hls = new Hls();
            hls.loadSource(channel.url);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                video.play();
                setupQualityLevels(hls.levels);
                showLoader(false);
            });

            hls.on(Hls.Events.ERROR, () => showLoader(false));
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = channel.url;
            video.addEventListener('loadedmetadata', () => {
                video.play();
                showLoader(false);
            });
        }
    }

    function setupQualityLevels(levels) {
        qualitySelect.innerHTML = '<option value="-1">Auto Quality</option>';
        levels.forEach((level, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.innerText = level.height ? `${level.height}p` : `Level ${index}`;
            qualitySelect.appendChild(option);
        });
    }

    qualitySelect.onchange = (e) => { hls.currentLevel = parseInt(e.target.value); };

    // Hover/Touch Overlay Timer
    function handleUserActivity() {
        videoWrapper.classList.add('user-active');
        clearTimeout(controlsTimeout);
        controlsTimeout = setTimeout(() => {
            if (!video.paused) videoWrapper.classList.remove('user-active');
        }, 3000);
    }

    videoWrapper.addEventListener('mousemove', handleUserActivity);
    videoWrapper.addEventListener('touchstart', handleUserActivity);

    // Controls
    playBtn.onclick = () => {
        if (video.paused) {
            video.play();
            playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        } else {
            video.pause();
            playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        }
    };

    muteBtn.onclick = () => {
        video.muted = !video.muted;
        volumeSlider.value = video.muted ? 0 : video.volume;
        muteBtn.innerHTML = video.muted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
    };

    volumeSlider.oninput = (e) => {
        video.volume = e.target.value;
        video.muted = (video.volume === 0);
        muteBtn.innerHTML = video.muted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
    };

    fullscreenBtn.onclick = () => {
        if (!document.fullscreenElement) {
            videoWrapper.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    };

    pipBtn.onclick = async () => {
        if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled) {
            await video.requestPictureInPicture();
        }
    };

    toggleSidebarBtn.onclick = () => sidebar.classList.toggle('open');
    searchInput.oninput = filterChannels;
    categorySelect.onchange = filterChannels;

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT') return;
        
        switch (e.key.toLowerCase()) {
            case ' ':
                e.preventDefault();
                playBtn.click();
                break;
            case 'f':
                fullscreenBtn.click();
                break;
            case 'm':
                muteBtn.click();
                break;
            case 'p':
                pipBtn.click();
                break;
            case 'arrowup':
                e.preventDefault();
                if (currentChannelIndex > 0) playChannel(currentChannelIndex - 1);
                break;
            case 'arrowdown':
                e.preventDefault();
                if (currentChannelIndex < channelsData.length - 1) playChannel(currentChannelIndex + 1);
                break;
        }
    });

    function showLoader(show) { loader.style.display = show ? 'block' : 'none'; }

    loadPlaylist();
</script>
</body>
</html>
