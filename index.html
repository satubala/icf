<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ICF Live TV Player</title>
  
  <!-- HLS.js Library for HLS Stream Support -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #0284c7;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0284c7;
      padding: 15px 20px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }

    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* Video Player Section */
    .player-section {
      flex: 3;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    video {
      width: 100%;
      max-height: 100%;
      outline: none;
    }

    .channel-title-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      backdrop-filter: blur(4px);
    }

    /* Sidebar / Channel List Section */
    .sidebar {
      flex: 1;
      min-width: 300px;
      max-width: 380px;
      background-color: var(--card-bg);
      display: flex;
      flex-direction: column;
      border-left: 1px solid #334155;
    }

    .search-box {
      padding: 15px;
      border-bottom: 1px solid #334155;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .channel-item {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      cursor: pointer;
      border-bottom: 1px solid #334155;
      transition: background 0.2s ease;
    }

    .channel-item:hover {
      background: #334155;
    }

    .channel-item.active {
      background: #0284c7;
    }

    .channel-logo {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: contain;
      background: #0f172a;
      margin-right: 12px;
    }

    .channel-info {
      display: flex;
      flex-direction: column;
    }

    .channel-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .loading-status {
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
    }

    /* Responsive Mobile UI */
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
        height: auto;
      }

      .player-section {
        height: 250px;
        flex: none;
      }

      .sidebar {
        max-width: 100%;
        height: calc(100vh - 310px);
      }
    }
  </style>
</head>
<body>

  <header>icf.pro.bd — Live Streaming</header>

  <div class="main-container">
    <!-- Video Player -->
    <div class="player-section">
      <div id="channelTitle" class="channel-title-bar">লোড হচ্ছে...</div>
      <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <!-- Channel Sidebar -->
    <div class="sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="চ্যানেল খুঁজুন..." onkeyup="filterChannels()">
      </div>
      <ul id="channelList" class="channel-list">
        <li class="loading-status">প্লেলিস্ট লোড করা হচ্ছে...</li>
      </ul>
    </div>
  </div>

  <script>
    const PLAYLIST_URL = "https://raw.githubusercontent.com/satubala/icf/refs/heads/main/playlist.m3u.m3u8";
    
    // Proxy for HTTP channels if site is on HTTPS
    const PROXY_URL = "https://corsproxy.io/?";

    const video = document.getElementById('videoPlayer');
    const channelListContainer = document.getElementById('channelList');
    const channelTitleDisplay = document.getElementById('channelTitle');
    
    let hls = new Hls();
    let channels = [];

    // Fetch and parse M3U Playlist
    async function loadPlaylist() {
      try {
        const response = await fetch(PLAYLIST_URL);
        if (!response.ok) throw new Error("প্লেলিস্ট লোড করা যায়নি");
        
        const content = await response.text();
        channels = parseM3U(content);

        if (channels.length === 0) {
          // If no EXTM3U tags found, treat playlist URL directly as a single video stream
          channels.push({
            name: "Live Channel",
            logo: "",
            url: PLAYLIST_URL
          });
        }

        renderChannelList(channels);

        // Auto-play first channel
        if (channels.length > 0) {
          playStream(channels[0].url, channels[0].name, 0);
        }

      } catch (error) {
        channelListContainer.innerHTML = `<li class="loading-status" style="color: #ef4444;">ত্রুটি: প্লেলিস্ট ফাইল পড়তে ব্যর্থ হয়েছে।</li>`;
        console.error(error);
      }
    }

    // Parse M3U Text
    function parseM3U(m3uText) {
      const lines = m3uText.split('\n');
      const parsedChannels = [];
      let currentChannel = null;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        if (line.startsWith('#EXTINF:')) {
          currentChannel = {};
          
          // Extract Logo
          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          currentChannel.logo = logoMatch ? logoMatch[1] : '';

          // Extract Channel Name
          const commaIndex = line.lastIndexOf(',');
          currentChannel.name = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : 'Unknown Channel';
        } 
        else if (line.length > 0 && !line.startsWith('#')) {
          if (currentChannel) {
            currentChannel.url = line;
            parsedChannels.push(currentChannel);
            currentChannel = null;
          }
        }
      }
      return parsedChannels;
    }

    // Render Channel Cards in Sidebar
    function renderChannelList(channelArray) {
      channelListContainer.innerHTML = '';

      if (channelArray.length === 0) {
        channelListContainer.innerHTML = `<li class="loading-status">কোনো চ্যানেল পাওয়া যায়নি।</li>`;
        return;
      }

      channelArray.forEach((channel, index) => {
        const li = document.createElement('li');
        li.className = 'channel-item';
        li.onclick = () => playStream(channel.url, channel.name, index);

        const logoSrc = channel.logo || 'https://via.placeholder.com/40/0f172a/ffffff?text=TV';

        li.innerHTML = `
          <img class="channel-logo" src="${logoSrc}" onerror="this.src='https://via.placeholder.com/40/0f172a/ffffff?text=TV'" alt="Logo">
          <div class="channel-info">
            <span class="channel-name">${channel.name}</span>
          </div>
        `;
        channelListContainer.appendChild(li);
      });
    }

    // Stream Playback Logic
    function playStream(url, name, index) {
      channelTitleDisplay.textContent = name;

      // Update active state in UI
      const items = document.querySelectorAll('.channel-item');
      items.forEach((item, idx) => {
        if (idx === index) item.classList.add('active');
        else item.classList.remove('active');
      });

      // Fix Mixed Content: If page is HTTPS but stream URL is HTTP, append proxy
      let streamUrl = url;
      if (window.location.protocol === 'https:' && streamUrl.startsWith('http://')) {
        streamUrl = PROXY_URL + encodeURIComponent(streamUrl);
      }

      // Initialize HLS.js Player
      if (Hls.isSupported()) {
        hls.destroy();
        hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play().catch(e => console.log("Auto-play was prevented by browser"));
        });
      } 
      // Safari / Native HLS Support
      else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', function () {
          video.play();
        });
      } 
      else {
        alert("আপনার ব্রাউজারটি HLS স্ট্রিমিং সাপোর্ট করে না।");
      }
    }

    // Search/Filter Channels
    function filterChannels() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = channels.filter(ch => ch.name.toLowerCase().includes(query));
      renderChannelList(filtered);
    }

    // Load Playlist on Page Load
    loadPlaylist();
  </script>
</body>
</html>
